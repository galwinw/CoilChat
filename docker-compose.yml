# ==================================================
# Coil.ai - Docker Compose Configuration
# ==================================================
# Services:
#   - api (Coil.ai/LibreChat) - Main application
#   - mongodb - Conversation storage
#   - meilisearch - Message search
#   - vectordb - Document embeddings (RAG)
#   - rag_api - Document chat API

services:
  # ===========================================
  # Coil MCP Server - HVAC Data Tools
  # ===========================================
  mcp_server:
    container_name: coil-mcp-server
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8123
    volumes:
      - ./mcp-server/.env:/app/.env:ro

  # ===========================================
  # Coil.ai Application (LibreChat)
  # ===========================================
  api:
    container_name: CoilAI
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      - mongodb
      - rag_api
      - mcp_server
    image: ghcr.io/danny-avila/librechat:latest
    restart: always
    user: "${UID}:${GID}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HOST=0.0.0.0
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
      - MEILI_HOST=http://meilisearch:7700
      - RAG_PORT=${RAG_PORT:-8000}
      - RAG_API_URL=http://rag_api:${RAG_PORT:-8000}
    volumes:
      - type: bind
        source: ./.env
        target: /app/.env
      - type: bind
        source: ./librechat.yaml
        target: /app/librechat.yaml
      - ./images:/app/client/public/images
      - ./uploads:/app/uploads
      - ./logs:/app/logs

  # ===========================================
  # MongoDB - Conversation Storage
  # ===========================================
  mongodb:
    container_name: coil-mongodb
    image: mongo:8.0.17
    restart: always
    user: "${UID}:${GID}"
    volumes:
      - ./data-node:/data/db
    command: mongod --noauth

  # ===========================================
  # Meilisearch - Message Search
  # ===========================================
  meilisearch:
    container_name: coil-meilisearch
    image: getmeili/meilisearch:v1.12.3
    restart: always
    user: "${UID}:${GID}"
    environment:
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_NO_ANALYTICS=true
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
    volumes:
      - ./meili_data_v1.12:/meili_data

  # ===========================================
  # VectorDB - Document Embeddings (for RAG)
  # ===========================================
  vectordb:
    container_name: coil-vectordb
    image: pgvector/pgvector:0.8.0-pg15-trixie
    environment:
      POSTGRES_DB: coil_rag
      POSTGRES_USER: coil
      POSTGRES_PASSWORD: coilpassword
    restart: always
    volumes:
      - pgdata2:/var/lib/postgresql/data

  # ===========================================
  # RAG API - Document Chat
  # ===========================================
  rag_api:
    container_name: coil-rag-api
    image: ghcr.io/danny-avila/librechat-rag-api-dev:latest
    environment:
      - DB_HOST=vectordb
      - RAG_PORT=${RAG_PORT:-8000}
    restart: always
    depends_on:
      - vectordb
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env

volumes:
  pgdata2:
